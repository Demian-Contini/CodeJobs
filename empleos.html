<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Listado de empleos y filtros para encontrar el trabajo de tus sueños en CodeJobs.">
  <title>CodeJobs | Empleos</title>
  <link rel="stylesheet" href="css/styles.css">
</head>

<body>

  <header class="navbar">
    <div class="navbar__brand">
      <svg class="navbar__logo" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"
        stroke-width="2" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <polyline points="16 18 22 12 16 6"></polyline>
        <polyline points="8 6 2 12 8 18"></polyline>
      </svg>
      <span class="navbar__name">CodeJobs</span>
    </div>

    <nav class="navbar__links">
      <a href="index.html">Inicio</a>
      <a href="#">Empresas</a>
      <a href="#">Salarios</a>
    </nav>

    <div class="navbar__actions">
      <a href="#" class="btn btn--ghost">Subir CV</a>
      <a href="#" class="navbar__avatar" aria-label="Perfil de usuario">
        <svg width="20" height="20" fill="currentColor" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg"
          aria-hidden="true">
          <path
            d="M230.92,212c-15.23-26.33-38.7-45.21-66.09-54.16a72,72,0,1,0-73.66,0C63.78,166.78,40.31,185.66,25.08,212a8,8,0,1,0,13.85,8c18.84-32.56,52.14-52,89.07-52s70.23,19.44,89.07,52a8,8,0,1,0,13.85-8ZM72,96a56,56,0,1,1,56,56A56.06,56.06,0,0,1,72,96Z" />
        </svg>
      </a>
    </div>
  </header>

  <main>
    <section class="jobs-search">
      <h2 class="jobs-search__title">Encuentra tu próximo trabajo</h2>
      <p class="jobs-search__subtitle">Explora miles de oportunidades en el sector tecnológico.</p>

      <form class="jobs-search__form" role="search">
        <div class="jobs-search__bar">
          <svg class="jobs-search__icon" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"
            fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"
            aria-hidden="true">
            <path d="M10 10m-7 0a7 7 0 1 0 14 0a7 7 0 1 0 -14 0" />
            <path d="M21 21l-6 -6" />
          </svg>
          <label for="jobs-search-input" class="sr-only">Buscar empleos</label>
          <input type="search" id="jobs-search-input" name="search" class="jobs-search__input"
            placeholder="Buscar trabajos, empresas o habilidades">
        </div>

        <div class="jobs-search__filters">
  <div class="jobs-search__field">
    <label for="filter-technology" class="sr-only">Tecnología</label>
    <select name="technology" id="filter-technology" class="jobs-search__select">
      <option value="">Tecnología</option>
      <optgroup label="Más buscadas">
        <option value="javascript">JavaScript</option>
        <option value="python">Python</option>
        <option value="react">React</option>
        <option value="nodejs">Node.js</option>
      </optgroup>
      <option value="java">Java</option>
      <option value="csharp">C#</option>
    </select>
  </div>

  <div class="jobs-search__field">
    <label for="filter-location" class="sr-only">Ubicación</label>
    <select name="location" id="filter-location" class="jobs-search__select">
      <option value="">Ubicación</option>
      <option value="buenos-aires">Buenos Aires</option>
      <option value="cordoba">Córdoba</option>
      <option value="remoto">Remoto</option>
    </select>
  </div>

  <div class="jobs-search__field">
    <label for="filter-experience-level" class="sr-only">Nivel de experiencia</label>
    <select name="experience-level" id="filter-experience-level" class="jobs-search__select">
      <option value="">Nivel de experiencia</option>
      <option value="junior">Junior</option>
      <option value="mid">Mid-level</option>
      <option value="senior">Senior</option>
      <option value="lead">Lead</option>
    </select>
  </div>
</div>
      </form>
    </section>

    <section class="jobs-results">
      <h2 class="jobs-results__title">Resultados de búsqueda</h2>

      <div class="job-list">
      </div>

      <nav class="pagination" aria-label="Paginación de resultados">
        <a href="#" class="pagination__arrow" aria-label="Página anterior">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M15 6l-6 6l6 6" />
          </svg>
        </a>
        <a href="#" class="pagination__link is-active">1</a>
        <a href="#" class="pagination__link">2</a>
        <a href="#" class="pagination__link">3</a>
        <a href="#" class="pagination__arrow" aria-label="Página siguiente">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M9 6l6 6l-6 6" />
          </svg>
        </a>
      </nav>
    </section>
  </main>

  <footer class="footer">
    <p class="footer__text">© 2025 CodeJobs. Todos los derechos reservados.</p>
  </footer>
  <script src="js/main.js" defer></script>
</body>

</html>
